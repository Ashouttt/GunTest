<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losownik Lektur i Pytań</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--primary);
        }

        p.subtitle {
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .box h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Losownik Lektur</h1>
        <p class="subtitle">Sprawdź swoją wiedzę przed egzaminem!</p>

        <button id="drawBtn" onclick="drawBook()">Wylosuj lekturę i pytania</button>

        <div id="resultContainer" class="hidden">
            <div class="box">
                <h3>Wylosowana lektura:</h3>
                <p id="bookTitle" style="font-size: 1.2rem; font-weight: bold; margin: 0;"></p>
            </div>

            <div class="box">
                <h3>Pytania powtórkowe:</h3>
                <ul id="questionsList" style="padding-left: 20px; margin: 0;">
                    <!-- Tutaj pojawią się pytania -->
                </ul>
            </div>
            
            <button onclick="drawBtn.click()" style="background-color: #64748b;">Wylosuj inną</button>
        </div>
    </div>

    <script>
        // Baza lektur i pytań (możesz ją łatwo rozbudowywać!)
        const database = [
            {
                title: "Pan Tadeusz – Adam Mickiewicz",
                questions: [
                    "Kto był sędzią i gdzie mieszkał?",
                    "Jaka była historia konfliktu rodu Sopliców z Horeszkami?",
                    "Kto okazał się księdzem Robakiem?",
                    "Jaką funkcję pełnił Wojski w Soplicowie?"
                ]
            },
            {
                title: "Zemsta – Aleksander Fredro",
                questions: [
                    "O co kłócili się Cześnik i Rejent?",
                    "Kto i dlaczego chciał naprawić mur graniczny?",
                    "Jakie cechy charakteru reprezentuje Dyndalski?",
                    "W jaki sposób zakończył się konflikt między sąsiadami?"
                ]
            },
            {
                title: "Kamienie na szaniec – Aleksander Kamiński",
                questions: [
                    "Jak nazywał się pseudonim grupowy głównych bohaterów (Małego Sabotażu)?",
                    "Przebieg akcji pod Arsenałem – kto został odbity?",
                    "Jak zginął Rudy?",
                    "W jaki sposób Zośka i Alek stracili życie?"
                ]
            },
            {
                title: "Balladyna – Juliusz Słowacki",
                questions: [
                    "Co zbierały tytułowa Balladyna i Alina w lesie?",
                    "Kto pomógł Balladynie pozbyć się siostry i zdobyć władzę?",
                    "Jaką rolę w utworze odgrywa królowa Gopła – Goplana?",
                    "Jaki los spotkał Balladynę na końcu dramatu?"
                ]
            }
        ];

        function drawBook() {
            // Losowanie indeksu z tablicy
            const randomIndex = Math.floor(Math.random() * database.length);
            const selected = database[randomIndex];

            // Wyświetlenie wylosowanej lektury
            document.getElementById('bookTitle').innerText = selected.title;

            // Wyświetlenie pytań
            const listElement = document.getElementById('questionsList');
            listElement.innerHTML = ''; // Wyczyść poprzednie pytania
            
            selected.questions.forEach(q => {
                const li = document.createElement('li');
                li.style.marginBottom = "8px";
                li.innerText = q;
                listElement.appendChild(li);
            });

            // Pokaż kontener z wynikiem
            document.getElementById('resultContainer').classList.remove('hidden');
        }
    </script>

</body>
</html>
